<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f17" />
  <title>Kaya Topbaş · Portfolio</title>
  <meta name="description" content="Kaya Topbaş's portfolio: a 3D room where every object opens a project." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D room. Use the project buttons to open each project."></canvas>

  <!-- floating labels over the 3D objects -->
  <div id="labels" aria-label="Projects in the room"></div>

  <header class="hud hud-top">
    <div class="brand">
      <span class="brand-name">Kaya Topbaş</span>
      <span class="brand-sub">Tap anything that glows</span>
    </div>
    <div class="hud-actions">
      <button id="menu-btn" class="chip" aria-haspopup="true" aria-expanded="false" aria-controls="menu">Projects</button>
      <button id="info-btn" class="chip icon" aria-label="Credits">i</button>
    </div>
  </header>

  <p class="hud hud-bottom" id="hint">Drag to look around · Pinch or scroll to zoom</p>

  <!-- list fallback (also used if WebGL is unavailable) -->
  <nav id="menu" class="menu" hidden>
    <ul id="menu-list"></ul>
  </nav>

  <div id="credits" class="menu credits" hidden>
    <p>3D protein: “<a href="https://sketchfab.com/3d-models/human-hexokinase-protein-d963bcdebd7140908ddf8e7f94610dee" target="_blank" rel="noopener">Human hexokinase protein</a>” by <a href="https://sketchfab.com/AVL" target="_blank" rel="noopener">Advanced Visualization Lab, Indiana University</a>, <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.</p>
    <p>Built with <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>.</p>
  </div>

  <!-- project viewer -->
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
    <div class="viewer-backdrop" data-close></div>
    <section class="viewer-panel">
      <header class="viewer-bar">
        <button class="back-btn" data-close aria-label="Back to the room">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Room</span>
        </button>
        <div class="viewer-titles">
          <h2 id="viewer-title"></h2>
          <p id="viewer-sub"></p>
        </div>
        <a id="viewer-ext" class="ext-btn" target="_blank" rel="noopener" aria-label="Open in a new tab">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </header>
      <div class="viewer-body">
        <div class="spinner" aria-hidden="true"></div>
        <iframe id="viewer-frame" title="Project" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; accelerometer; gyroscope; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>
  </div>

  <div id="loader" class="loader">
    <div class="loader-inner">
      <p>Setting up the room…</p>
      <div class="bar"><span id="loader-bar"></span></div>
      <p class="pct" id="loader-pct">0%</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
